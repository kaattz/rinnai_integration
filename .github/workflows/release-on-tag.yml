name: Release on Tag

# NOTE: this repository is a fork. GitHub does not run workflows on tag pushes
# in forks by default, so this workflow stays idle until Actions is enabled in
# Settings -> Actions -> General. workflow_dispatch is provided so a release can
# be rebuilt by hand once Actions is enabled.
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.0.7'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Resolve tag name
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          TAG_NAME="${{ inputs.tag }}"
        else
          TAG_NAME="${GITHUB_REF#refs/tags/}"
        fi
        echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
        echo "Resolved tag: ${TAG_NAME}"

    - name: Zip project
      run: |
        zip -r "${{ steps.tag.outputs.TAG_NAME }}.zip" . \
          -x ".git/*" "*.zip" ".github/*" \
             "*/__pycache__/*" "*.pyc" ".pytest_cache/*"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.TAG_NAME }}
        name: Release ${{ steps.tag.outputs.TAG_NAME }}
        body: |
          release： ${{ steps.tag.outputs.TAG_NAME }}
        draft: false
        prerelease: false
        files: ${{ steps.tag.outputs.TAG_NAME }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
